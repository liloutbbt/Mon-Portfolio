<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Lilou Tibbaut</title>
    <meta name="description" content="Contacter Lilou Tibbaut pour une alternance en informatique à partir de janvier 2027, à Marseille et alentours.">
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/script.js" defer></script>
</head>
<body>
    <div class="page">
        <header class="entete" id="haut"></header>

        <main>
            <section class="section">
                <div class="contact">
                    <div>
                        <p class="badge"><span class="point"></span> Disponible pour janvier 2027</p>
                        <h1>Une alternance ? Parlons-en.</h1>

                        <h2>Coordonnées</h2>
                        <p>Je recherche une alternance en informatique, plus précisément en IA. Je suis basée à Marseille et ses alentours.</p>
                        <ul class="liens">
                            <li><a href="mailto:lilou.tibbaut@gmail.com">lilou.tibbaut@gmail.com</a></li>
                            <li><a href="https://www.linkedin.com/in/lilou-tibbaut-952040192/" target="_blank" rel="noopener">LinkedIn ↗</a></li>
                            <li><a href="https://github.com/liloutbbt" target="_blank" rel="noopener">GitHub ↗</a></li>
                        </ul>
                    </div>

                    <div>
                        <h2>Formulaire</h2>
                        <form action="mailto:lilou.tibbaut@gmail.com" method="post" enctype="text/plain" class="formulaire">
                            <label for="nom">Nom et entreprise</label>
                            <input type="text" id="nom" name="nom" autocomplete="name" required>
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" autocomplete="email" required>
                            <label for="sujet">Sujet</label>
                            <select id="sujet" name="sujet">
                                <option value="alternance">Proposition d'alternance</option>
                                <option value="question">Question</option>
                                <option value="autre">Autre</option>
                            </select>
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                            <button type="submit" class="bouton bouton-jaune">Envoyer le message</button>
                        </form>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer"></footer>
    </div>
</body>
</html>
