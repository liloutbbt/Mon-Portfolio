<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="contact.title">Contact | Lilou Tibbaut</title>
    <meta name="description" content="Contacter Lilou Tibbaut pour une alternance en informatique à partir de janvier 2027, à Marseille et alentours." data-i18n-content="contact.description">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/traductions.js" defer></script>
    <script src="assets/script.js" defer></script>
</head>
<body>
    <div class="page">
        <header class="entete" id="haut"></header>

        <main>
            <section class="section">
                <div class="contact">
                    <div>
                        <p class="badge"><span class="point"></span> <span data-i18n="contact.dispo">Disponible pour janvier 2027</span></p>
                        <h1 data-i18n="contact.titre">Une alternance ? Parlons-en.</h1>

                        <h2 data-i18n="contact.coordonnees">Coordonnées</h2>
                        <p data-i18n="contact.texte">Je recherche une alternance en informatique, plus précisément en IA. Je suis basée à Marseille et ses alentours.</p>
                        <p class="email"><a href="mailto:lilou.tibbaut@gmail.com">lilou.tibbaut@gmail.com</a></p>
                        <ul class="liens">
                            <li>
                                <a href="https://www.linkedin.com/in/lilou-tibbaut-952040192/" target="_blank" rel="noopener" aria-label="Mon profil LinkedIn" title="LinkedIn" data-i18n-aria="contact.linkedinAria">
                                    <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
                                </a>
                            </li>
                            <li>
                                <a href="https://github.com/liloutbbt" target="_blank" rel="noopener" aria-label="Mon profil GitHub" title="GitHub" data-i18n-aria="contact.githubAria">
                                    <i class="fa-brands fa-github" aria-hidden="true"></i>
                                </a>
                            </li>
                        </ul>
                    </div>

                    <div>
                        <h2 data-i18n="contact.formulaire">Formulaire</h2>
                        <form action="mailto:lilou.tibbaut@gmail.com" method="post" enctype="text/plain" class="formulaire">
                            <label for="nom" data-i18n="contact.nom">Nom et entreprise</label>
                            <input type="text" id="nom" name="nom" autocomplete="name" required>
                            <label for="email" data-i18n="contact.email">E-mail</label>
                            <input type="email" id="email" name="email" autocomplete="email" required>
                            <label for="sujet" data-i18n="contact.sujet">Sujet</label>
                            <select id="sujet" name="sujet">
                                <option value="alternance" data-i18n="contact.alternance">Proposition d'alternance</option>
                                <option value="question">Question</option>
                                <option value="autre" data-i18n="contact.autre">Autre</option>
                            </select>
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                            <button type="submit" class="bouton bouton-jaune" data-i18n="contact.envoyer">Envoyer le message</button>
                        </form>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer"></footer>
    </div>
</body>
</html>
